<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Dr. Strange — Wrist Twist</title>
<style>
  html, body { margin: 0; height: 100%; background: #070403; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
  p { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      margin: 0; color: #ffb35c; font: 14px/1.4 system-ui, sans-serif;
      opacity: .8; user-select: none; pointer-events: none; }
</style>
</head>
<body>
<canvas id="portal"></canvas>
<p>Twist the mouse left/right to summon · move to carry it · P = toggle · right-click = close</p>

<script type="module">
import { Portal, TwistDetector } from '/src/strange.js';

const canvas = document.getElementById('portal');
const portal = new Portal(canvas);
const twist = new TwistDetector();

let W, H, DPR;
function resize() {
  W = innerWidth; H = innerHeight;
  DPR = Math.min(devicePixelRatio || 1, 2);
  portal.resize(W, H, DPR);
}
resize();
addEventListener('resize', resize);

let palm = { x: W / 2, y: H / 2 };

canvas.addEventListener('pointermove', (e) => {
  const t = performance.now() / 1000;
  palm = { x: e.clientX, y: e.clientY };
  const roll = (e.movementX || 0) * 0.006;
  const hit = twist.push(roll, palm, t);
  portal.emit(palm.x, palm.y, 2, 120);
  if (hit) {
    twist.reset();
    portal.toggle(palm.x, palm.y, 0);
  }
});

canvas.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  portal.close();
});

addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'p') portal.toggle(palm.x, palm.y, 0);
});

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (portal.isOpen) portal.follow(palm.x, palm.y, 0);
  else portal.aim(palm.x, palm.y, twist.progress(), 0);
  portal.tiltTo(Math.max(-1, Math.min(1, twist.sum)));
  portal.update(dt);
  portal.draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
